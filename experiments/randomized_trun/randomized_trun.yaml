command:
  - ${env}
  - python
  - ${program}
  - "--config-name"
  - "quasideer_gru_trun"
  - ${args_no_hyphens}
method: grid
parameters:
  model_cfg.configs.num_iters:
    values: [6]
  model_cfg.configs.deer_norm:
    values: [True, False]
  model_cfg.configs.dropout:
    values: [0.0, 0.1]
  callbacks.trun_iters.fixed_epochs:
    values: [0, 10, 40]

program: ../../scripts/run_group_multiplication.py
project: group_multiplication_trun

# Run:
# wandb sweep randomized_trun.yaml