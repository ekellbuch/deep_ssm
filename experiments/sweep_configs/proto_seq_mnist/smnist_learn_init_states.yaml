command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
method: grid
parameters:
  model_cfg.learn_diags:
    values:
      - False
  model_cfg.last_only:
    values:
      - False
  model_cfg.num_iters:
    values:
      - 2
      - 3
      - 4
  model_cfg.learn_initial_states:
    values:
      - True
      - False
  model_cfg.clip:
    values:
      - True
      - False
  optimizer_cfg.clip_grads:
    values:
      - True
      - False
program: seq_mnist_hydra.py
project: nonlinear_ssm
name: learn_init_states