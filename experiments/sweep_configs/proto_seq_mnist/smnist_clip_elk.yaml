command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
method: grid
parameters:
  seed:
    values:
      - 0
      - 1
      - 2
      - 3
  model_cfg.parallel:
    values:
      - True
  model_cfg.method:
    values:
      - "gru"
  model_cfg.learn_diags:
    values:
      - False
  model_cfg.clip:
    values:
      - False
  model_cfg.num_iters:
    values:
      - 3
      - 4
      - 5
      - 6
      - 7
program: seq_mnist_hydra.py
project: nonlinear_ssm
name: smnist_clip_elk