# Created 1/19/25
# Goal: run 3 seeds of a sequential GRU on sCIFAR
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
method: grid
parameters:
  seed:
    values:
      - 1
      - 2
      - 3
  data_cfg.explore:
    values:
      - True
  data_cfg.dataset_name:
    values:
      - "cifar"
  model_cfg.parallel:
    values:
      - False
  model_cfg.method:
    values:
      - "gru"
  model_cfg.use_mean:
    values:
      - True
      - False
program: seq_mnist_hydra.py
project: nonlinear_ssm
name: cifar-seq