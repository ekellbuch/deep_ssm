Comment : >
  # trying to see the effects of only differentiating wrt the last layer, and also using gradient clipping. it seems that differentating wrt the last layer only is a bad idea (at least when only using 4 iterations)

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
method: grid
parameters:
  model_cfg.clip:
    values:
      - True
      - False
  model_cfg.learn_diags:
    values:
      - False
  model_cfg.last_only:
    values:
      - True
      - False
  model_cfg.num_iters:
    values:
      - 4
  optimizer_cfg.clip_grads:
    values:
      - True
      - False
program: seq_mnist_hydra.py
project: nonlinear_ssm