# Run seeded gru w elk
# for 2 and 3 seeds
name: compare_elk_iters
program: scripts/run.py
method: grid
metric:
  name: ctc_loss_validation
  goal: minimize
parameters:
  seed:
    values: [0, 1, 2]



#Comment: >
#  Run: run sweeps across best mamba configuration.
#  wandb sweep experiments/bci_seeds/run_seeded_gru.yaml

command:
  - ${env}
  - python
  - ${program}
  - "--config-name"
  - "baseline_gru"
  - ${args_no_hyphens}