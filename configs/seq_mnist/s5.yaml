Comment: >
  # This trains the baseline S5 model on sequential MNIST
  python run.py --config-path="../configs/seq_mnist" --config-name="s5" trainer_cfg.fast_dev_run=1 model_cfg.configs.n_layers=1 

# S5 Sequential MNIST Configuration
project_name: "seq_debug"
experiment_name: "seq_debug"

seed: 42


data_cfg:
  dataset_module: "sequential_mnist"
  batchSize: 64
  num_workers: 0
  train_split: 0.9
  data_dir: "./data"

module_cfg:
  type: "sequential"

model_cfg:
  type: "s5_base"
  resume_ckpt_path:   # load weights from ckpt but not parameters.
  configs:
    d_model: 256
    n_layers: 4
    ssm_size: 384
    blocks: 3
    dropout: 0.1
    bidirectional: true
    C_init: "lecun_normal"
    conj_sym: true
    clip_eigs: true
    discretization: "zoh"
    activation: "gelu"
    prenorm: false
    batchnorm: false
    bn_momentum: 0.95
    bandlimit: 0.5
    dt_min: 0.001
    dt_max: 0.1
    d_input: 1
    d_output: 10

optimizer_cfg:
  lr_factor: 4.5
  ssm_lr_base: 0.001
  weight_decay: 0.0  # MNIST typically uses no weight decay


trainer_cfg:
  max_epochs: 250
  accelerator: "auto"
  devices: 1
  precision: 32
  fast_dev_run: false
  logger: "wandb"  # or none
  log_every_n_steps: 50

callbacks:
  lr_monitor:
    logging_interval: "step"
  early_stopping:
    monitor: "val_accuracy"
    mode: "max"
    patience: 20
    verbose: true
  checkpoint_cfg:
    dirpath: "checkpoints/s5_mnist"
    filename: "s5-{epoch:02d}-{val_accuracy:.3f}"
    monitor: "val_accuracy"
    mode: "max"
    save_top_k: 3
    save_last: true

eval_cfg:
  eval_only: 0
  ckpt_path: