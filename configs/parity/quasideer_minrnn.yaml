Comment: >
  # This trains the baseline model (fast_dev_run is a debugging flag)
  python run.py --config-name="baseline_gru" trainer_cfg.fast_dev_run=1 model_cfg.configs.layer_dim=1

project_name: "parity"
experiment_name: "quasideer_minrnn"

seed: 0

data_cfg:
  batchSize: 32
  num_workers: 0
  datasetPath: "/pscratch/sd/j/jwl50/deep_ssm/data/Parity"

model_cfg:
  type: "state_tracking_prnn"
  configs:
    vocab_size: 2
    embed_size: 64
    hidden_size: 64
    bidirectional: false
    num_iters: 2
    num_layers: 1
    method: "minrnn"
    parallel: true

module_cfg:
  type: "state_tracking"

optimizer_cfg:
  type: "adam"
  configs:
    lr: 0.001  # lrStart

callbacks:
  lr_monitor:
    logging_interval: "step"

trainer_cfg:
  fast_dev_run: false
  logger: "wandb"
  accelerator: "auto"
  max_epochs: 20

eval_cfg:
  eval_only: 0 # set checkpoint path from which to resume job (reloads parameters)

hydra:
  run:
    dir: ./outputs/${now:%y-%m-%d}/${now:%H-%M-%S}
