Comment: >
  # This trains the baseline model (fast_dev_run is a debugging flag)
  python run.py --config-name="baseline_gru" trainer_cfg.fast_dev_run=1 model_cfg.configs.layer_dim=1

project_name: "icl"
experiment_name: "baseline_prnn"

seed: 0

data_cfg:
  n_trajectories: 1024
  n_w_samples: 0
  seq_length: 40
  d_input: 5
  d_output: 1
  noise_std: 0.1
  batch_size: 1024


module_cfg:
  type: "icl"

model_cfg:
  type: "bci_gru"
  configs:
    neural_dim: 256 #nInputFeatures
    n_classes: 40 #nClasses
    # gru params
    hidden_dim: 1024 #nUnits
    layer_dim: 5 #nLayers
    dropout: 0.4
    bidirectional: true
    # base decoder parameters:
    gaussianSmoothWidth: 2.0
    unfolding: true
    strideLen: 4
    kernelLen: 32
    input_nonlinearity: "softsign"

optimizer_cfg:
  type: "adam"
  configs:
    lr: 0.02  # lrStart
    betas: [0.9, 0.999]
    eps: 0.1
    weight_decay: 1e-5  #l2_decay

scheduler_cfg:
  type: "linear"
  interval: "step"
  frequency: 1
  configs:
    start_factor : 1.0
    end_factor: 1.0

callbacks:
  lr_monitor:
    logging_interval: "step"
  grad_norm:
    type:
  checkpoint_cfg:
    save_top_k: 1
    monitor: "ctc_loss_validation"

trainer_cfg:
  fast_dev_run: false
  logger: "wandb"
  accelerator: "auto"
  max_steps: 10000
  log_every_n_steps: 100


eval_cfg:
  eval_only: 0 # set checkpoint path from which to resume job (reloads parameters)

hydra:
  run:
    dir: ./outputs/${now:%y-%m-%d}/${now:%H-%M-%S}
