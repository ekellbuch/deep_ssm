Comment: >
  # trains on A5 with linear RNN

project_name: "nonlinear_ssm"
experiment_name: "linear_rnn"

seed: 0

data_cfg:
  group: "A5"
  k: 8
  max_samples: 1000000
  batchSize: 512
  num_workers: 0
  datasetPath: "${oc.env:DEEP_SSM_DATA}/group_multiplication/data"

model_cfg:
  type: "state_tracking_linear"
  configs:
    embed_size: 128
    hidden_size: 16
    num_layers: 3

module_cfg:
  type: "state_tracking"

optimizer_cfg:
  type: "adam"
  configs:
    lr: 0.001  # lrStart

callbacks:
  lr_monitor:
    logging_interval: "step"

trainer_cfg:
  fast_dev_run: false
  logger: "wandb"
  accelerator: "auto"
  max_epochs: 50

eval_cfg:
  eval_only: 0 # set checkpoint path from which to resume job (reloads parameters)
  ckpt_path: #"/scratch/groups/swl1/group_multiplication/checkpoints/quasideer_gru_S5_32_gru_5_0/model.ckpt"

hydra:
  run:
    dir: "${oc.env:GROUP_SCRATCH}/${oc.env:USER}/outputs/${now:%y-%m-%d}/${now:%H-%M-%S}"
