Comment: >
  # This trains the baseline model (fast_dev_run is a debugging flag)
  python run_group_multiplication.py --config-name="quasideer_gru_trun" trainer_cfg.fast_dev_run=1 model_cfg.configs.num_layers=1
  python run_group_multiplication.py --config-name="quasideer_gru_trun" trainer_cfg.max_epochs=4  +trainer_cfg.limit_train_batches=1 +trainer_cfg.limit_test_batches=1 +trainer_cfg.limit_val_batches=1 

  # Experiments: randomized last 40 or last 10 truncations
  # Experiments: fixed truncation truncation
  python run_group_multiplication.py --config-name="quasideer_gru_trun" +trainer_cfg.limit_train_batches=1 +trainer_cfg.limit_test_batches=1 +trainer_cfg.limit_val_batches=1 

  python run_group_multiplication.py --config-name="quasideer_gru_trun" callbacks.trun_iters.fixed_epochs=10
  python run_group_multiplication.py --config-name="quasideer_gru_trun" callbacks.trun_iters.fixed_epochs=40
  

project_name: "group_multiplication_trun"
experiment_name: "quasideer_gru"

seed: 0

common:

data_cfg:
  group: "S5"
  k: 32
  max_samples: 1000000
  batchSize: 512
  num_workers: 0
  datasetPath: "${oc.env:DEEP_SSM_DATA}/group_multiplication/data"
  seed: 0

model_cfg:
  type: "state_tracking_prnn"
  configs:
    embed_size: 128
    hidden_size: 370
    num_layers: 1
    bidirectional: false
    num_iters: 6
    method: "gru"
    parallel: true
    k: 0.1
    clip: false
    quasi: true
    reparameterize: false

module_cfg:
  type: "state_tracking"
  rescale_loss: "num_iters"

optimizer_cfg:
  type: "adam"
  configs:
    lr: 0.001  # lrStart

callbacks:
  lr_monitor:
    logging_interval: "step"
  trun_iters:
    truncation_method: "random_sample" # random_sample or fixed_values
    truncation_schedule: "random_interval" # random_interval or fixed_epochs
    truncation_epochs: [2, 3]  # used if truncation_schedule is fixed_epochs
    truncation_values: [2, 1]  # used if truncation_method is fixed_values
    fixed_epochs: 10  # first fixed_epochs epochs uses model_cfg.configs.num_iters
    max_iters_trunc: 6
  checkpoint_cfg:
    dirpath: "${oc.env:OAK}/${oc.env:USER}/state_tracking/icml2025/checkpoints" # Specify the checkpoint save directory
    filename: "best_model-{epoch}-{val_loss:.4f}"  # Naming format for checkpoint files
    save_top_k: 1  # Save only the best checkpoint
    save_last: true
    monitor: "avg_validation_loss"  # Metric to monitor for saving checkpoints
    mode: "min"  # Minimize the monitored metric (use "max" for metrics like accuracy)
    save_weights_only: false  # Save the entire model (set to true if you only need weights)
  early_stopping:
    monitor: "avg_validation_loss"
    min_delta: 1e-4
    patience: 10
    verbose: false
    mode: "min"

trainer_cfg:
  fast_dev_run: false
  logger: "wandb"
  accelerator: "auto"
  max_epochs: 50

eval_cfg:
  eval_only: 0 # set checkpoint path from which to resume job (reloads parameters)

hydra:
  run:
    dir: "${oc.env:GROUP_SCRATCH}/${oc.env:USER}/outputs/${now:%y-%m-%d}/${now:%H-%M-%S}"
