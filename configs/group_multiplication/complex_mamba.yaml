Comment: >
  # This trains the baseline model (fast_dev_run is a debugging flag)
  python run_group_multiplication.py --config-name="complex_mamba" trainer_cfg.fast_dev_run=1 model_cfg.configs.layer_dim=1
  python run_group_multiplication.py --config-name="complex_mamba" trainer_cfg.max_epochs=1  trainer_cfg.limit_train_batches=1 trainer_cfg.limit_test_batches=1 trainer_cfg.limit_val_batches=1 
  python run_group_multiplication.py --config-name="complex_mamba" trainer_cfg.max_epochs=20  trainer_cfg.limit_train_batches=1 trainer_cfg.limit_test_batches=1 trainer_cfg.limit_val_batches=1 

project_name: "group_multiplication"
experiment_name: "complex_mamba"

seed: 0

data_cfg:
  group: "A5"
  k: 16
  max_samples: 1000000
  batchSize: 512
  num_workers: 0
  datasetPath: "${oc.env:DEEP_SSM_DATA}/group_multiplication/data"
  seed: 0

model_cfg:
  type: "state_tracking_mamba"
  configs:
    embed_size: 128
    d_state: 32
    d_conv: 4
    expand_factor: 1
    num_layers: 6
    neg_pos_eigenvalues: true
    as_complex: true
    as_BC_complex_split: false


module_cfg:
  type: "state_tracking"

optimizer_cfg:
  type: "adam"
  configs:
    lr: 0.001  # lrStart
    #weight_decay: 0.1

trainer_cfg:
  fast_dev_run: false
  logger: "wandb"
  accelerator: "auto"
  max_epochs: 100
  gradient_clip_val: 1.0
  deterministic: true
  limit_train_batches:
  limit_val_batches:
  limit_test_batches:

#scheduler_cfg:
#  warmup_epochs: 1
#  type: "cosine_annealing"
#  configs:
#      T_max: 100

callbacks:
  lr_monitor:
    logging_interval: "step"
  checkpoint_cfg:
    dirpath: "${oc.env:OAK}/${oc.env:USER}/state_tracking/icml2025/checkpoints" # Specify the checkpoint save directory
    filename: "best_model-{epoch}-{val_loss:.4f}"  # Naming format for checkpoint files
    save_top_k: 1  # Save only the best checkpoint
    save_last: true
    monitor: "avg_validation_loss"  # Metric to monitor for saving checkpoints
    mode: "min"  # Minimize the monitored metric (use "max" for metrics like accuracy)
    save_weights_only: false  # Save the entire model (set to true if you only need weights)

eval_cfg:
  eval_only: 0 # set checkpoint path from which to resume job (reloads parameters)
  ckpt_path: "{oc.env:OAK}/${oc.env:USER}/state_tracking/icml2025/checkpoints"


hydra:
  run:
    dir: "${oc.env:GROUP_SCRATCH}/${oc.env:USER}/outputs/${now:%y-%m-%d}/${now:%H-%M-%S}"
