Comment: >
  # This trains the baseline model (fast_dev_run is a debugging flag)
  python run.py --config-name="mamba" trainer_cfg.fast_dev_run=1 model_cfg.configs.layer_dim=1

project_name: "group_multiplication"
experiment_name: "complex_mamba"

seed: 0

data_cfg:
  group: "A5"
  k: 16
  max_samples: 1000000
  batchSize: 512
  num_workers: 0
  datasetPath: "/scratch/groups/swl1/group_multiplication/data"
  seed: 0

model_cfg:
  type: "state_tracking_mamba"
  configs:
    embed_size: 128
    d_state: 32
    d_conv: 4
    expand_factor: 1
    num_layers: 1
    neg_pos_eigenvalues: false
    as_complex: true

module_cfg:
  type: "state_tracking"

optimizer_cfg:
  type: "adam"
  configs:
    lr: 0.001  # lrStart

callbacks:
  lr_monitor:
    logging_interval: "step"

trainer_cfg:
  fast_dev_run: false
  logger: "wandb"
  accelerator: "auto"
  max_epochs: 100

eval_cfg:
  eval_only: 0 # set checkpoint path from which to resume job (reloads parameters)

hydra:
  run:
    dir: ./outputs/${now:%y-%m-%d}/${now:%H-%M-%S}
