Comment: >
  # This trains the baseline model (fast_dev_run is a debugging flag)
  python run_group_multiplication.py --config-name="quasideer_gru" trainer_cfg.fast_dev_run=1 model_cfg.configs.num_layers=1
  python run_group_multiplication.py --config-name="quasideer_gru" trainer_cfg.max_epochs=1  +trainer_cfg.limit_train_batches=1 +trainer_cfg.limit_test_batches=1 +trainer_cfg.limit_val_batches=1 

project_name: "group_multiplication"
experiment_name: "quasideer_gru"

seed: 0

data_cfg:
  group: "S5"
  k: 32
  max_samples: 1000000
  batchSize: 512
  num_workers: 0
  datasetPath: "${oc.env:DEEP_SSM_DATA}/group_multiplication/data"
  seed: 0

model_cfg:
  type: "state_tracking_prnn"
  configs:
    embed_size: 128
    hidden_size: 370
    num_layers: 1
    bidirectional: false
    num_iters: 4
    method: "gru"
    parallel: true
    k: 0.0
    clip: true
    quasi: true
    reparameterize: false

module_cfg:
  type: "state_tracking"

optimizer_cfg:
  type: "adam"
  configs:
    lr: 0.001  # lrStart

callbacks:
  lr_monitor:
    logging_interval: "step"

trainer_cfg:
  fast_dev_run: false
  logger: "wandb"
  accelerator: "auto"
  max_epochs: 50

eval_cfg:
  eval_only: 0 # set checkpoint path from which to resume job (reloads parameters)
  ckpt_path:  #"/scratch/groups/swl1/group_multiplication/checkpoints/quasideer_gru_S5_32_gru_5_0/model.ckpt"

hydra:
  run:
    dir: "${oc.env:GROUP_SCRATCH}/${oc.env:USER}/outputs/${now:%y-%m-%d}/${now:%H-%M-%S}"
