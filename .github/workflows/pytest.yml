name: Run Tests

on:
  pull_request:
  push:
    branches: [add_s5]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MICROMAMBA_PKGS_DIR: ~/micromamba/pkgs

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache micromamba packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/micromamba
          ~/micromamba/pkgs
        key: micromamba-${{ runner.os }}-${{ hashFiles('environment_cpu.yaml') }}
        restore-keys: |
          micromamba-${{ runner.os }}-
  
    - name: Cache full micromamba environment
      id: cache-env
      uses: actions/cache@v4
      with:
        path: /home/runner/micromamba/envs/test-env
        key: micromamba-env-${{ runner.os }}-${{ hashFiles('environment_cpu.yaml') }}
        restore-keys: |
          micromamba-env-${{ runner.os }}-
 
    - name: Set up Micromamba
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: environment_cpu.yaml
        environment-name: test-env
        init-shell: bash
        cache-environment: true

    - name: Save full micromamba environment
      if: steps.cache-env.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /home/runner/micromamba/envs/test-env
        key: micromamba-env-${{ runner.os }}-${{ hashFiles('environment_cpu.yaml') }}

    - name: Verify Python and Conda environment
      shell: micromamba-shell {0}
      run: |
        which python
        python --version
        micromamba info
        micromamba list

    - name: Install package in development mode
      shell: micromamba-shell {0}
      run: |
        pip install -e src/

    - name: Run tests
      id: pytest
      shell: micromamba-shell {0}
      run: |
        pytest tests/ -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
